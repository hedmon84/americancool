# Configuración del CMS (Pages CMS) — panel en https://app.pagescms.org
# Cada producto es una ficha propia dentro de data/productos/.
# Al guardar, GitHub reconstruye data/products.json, que es lo que carga el sitio.

media:
  - name: productos
    label: Fotos de productos
    input: assets/products
    output: assets/products
    categories: [image]
  - name: banners
    label: Banners del slider
    input: assets/banners
    output: assets/banners
    categories: [image]

content:
  - name: productos
    label: Productos
    type: collection
    path: data/productos
    format: json
    filename: "{fields.sku}.json"
    view:
      primary: nombre
      fields: [nombre, sku, categoria]
      search: [nombre, sku, descripcion]
      sort: nombre
      order: asc
    fields:
      - name: nombre
        label: Nombre del producto
        type: string
        required: true
        description: "Ej.: Aire Acondicionado Split 18,000 BTU"

      - name: sku
        label: Código (SKU)
        type: string
        required: true
        description: "Código único del producto; también es el nombre del archivo. Ej.: L02A00132"

      - name: categoria
        label: Categoría
        type: select
        required: true
        options:
          values:
            - name: aires
              label: Aires Acondicionados
            - name: refrigeradores
              label: Refrigeradores
            - name: congeladores
              label: Congeladores
            - name: estufas
              label: Estufas
            - name: vitrinas
              label: Vitrinas

      - name: descripcion
        label: Descripción corta
        type: text
        description: "La línea que aparece en la tarjeta del catálogo. Ej.: Gas R410 · SEER 13. Dimensiones 29 × 85 × 19 cm."

      - name: imagenes
        label: Fotos del producto
        type: image
        list: true
        options:
          media: productos
        description: "La primera foto es la que se ve en el catálogo. Arrastra para cambiar el orden."

      - name: detalle
        label: Página de detalle
        type: object
        fields:
          - name: descripcion
            label: Descripción larga
            type: text
            description: "Párrafo que explica el producto en su página de detalle."

          - name: especificaciones
            label: Especificaciones principales
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.etiqueta}: {fields.valor}"
            description: "Se muestran destacadas en recuadros (capacidad, voltaje, dimensiones…)."
            fields:
              - name: etiqueta
                label: Característica
                type: string
                description: "Ej.: Capacidad"
              - name: valor
                label: Valor
                type: string
                description: "Ej.: 18,000 BTU"

          - name: adicionales
            label: Información adicional
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.etiqueta}: {fields.valor}"
            description: "Tabla de datos secundarios (garantía, modos, accesorios…)."
            fields:
              - name: etiqueta
                label: Característica
                type: string
                description: "Ej.: Garantía"
              - name: valor
                label: Valor
                type: string
                description: "Ej.: 1 año"

  - name: banners
    label: Banners del slider
    type: file
    path: data/banners.json
    format: json
    fields:
      - name: banners
        label: Banners de la página de inicio
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.texto}"
        description: "Se muestran en la cinta que gira debajo del encabezado, en el orden de esta lista. Arrastra para reordenar."
        fields:
          - name: imagen
            label: Imagen del banner
            type: image
            required: true
            options:
              media: banners
            description: "Formato horizontal tipo cinta (proporción 728 × 90). Lo ideal es subirla en 2184 × 270 px para que se vea nítida."
          - name: texto
            label: Texto alternativo
            type: string
            required: true
            description: "Describe la promoción en una frase. Lo leen Google y los lectores de pantalla; no se ve en la página."
          - name: enlace
            label: Enlace (opcional)
            type: string
            description: "Si lo llenas, el banner se vuelve clicable. Ej.: catalogo.html?categoria=congeladores"
          - name: activo
            label: Mostrar en el sitio
            type: boolean
            default: true
            description: "Desactívalo para ocultar el banner sin borrarlo."

  - name: categorias
    label: Categorías
    type: file
    path: data/categorias.json
    format: json
    fields:
      - name: categorias
        label: Categorías
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.nombre}"
        description: "Aparecen en el inicio y en los filtros del catálogo."
        fields:
          - name: id
            label: Identificador
            type: string
            required: true
            description: "En minúsculas, sin espacios ni tildes (ej.: aires). No lo cambies si ya hay productos usándolo."
          - name: nombre
            label: Nombre visible
            type: string
            required: true
          - name: descripcion
            label: Descripción
            type: text
