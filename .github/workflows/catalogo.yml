name: Reconstruir catálogo

# Cuando el CMS guarda un producto o una categoría, se vuelve a generar
# data/products.json, que es el archivo que carga el sitio.
on:
  push:
    branches: [main]
    paths:
      - 'data/productos/**'
      - 'data/categorias.json'
      - 'tools/build_catalog.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar data/products.json
        run: python3 tools/build_catalog.py

      - name: Publicar si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el catálogo."
          else
            git commit -m "Actualiza el catálogo desde el CMS"
            git push
          fi
