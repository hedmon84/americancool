name: Publicar en el hosting

# Reconstruye el catálogo y sube el sitio al servidor por FTP.
# Requiere tres secretos del repositorio (Settings > Secrets and variables > Actions):
#   FTP_SERVIDOR  -> ej. ftp.tudominio.com
#   FTP_USUARIO   -> usuario FTP creado en cPanel
#   FTP_CLAVE     -> contraseña de ese usuario
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Regenerar el catálogo, las páginas de producto y el sitemap
      #    a partir de las fichas del CMS. Si algo está mal, falla aquí y
      #    el sitio se queda con la última versión buena.
      - name: Generar catálogo
        run: python3 tools/build_catalog.py

      - name: Guardar lo generado si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/products.json sitemap.xml '*.html'
          if git diff --staged --quiet; then
            echo "Catálogo sin cambios."
          else
            git commit -m "Actualiza el catálogo desde el CMS [skip ci]"
            git push
          fi

      # 2. Subir el sitio ya actualizado al hosting
      - name: Subir por FTP
        if: ${{ vars.FTP_ACTIVO == 'si' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_CLAVE }}
          protocol: ${{ vars.FTP_PROTOCOLO || 'ftps' }}
          server-dir: ${{ vars.FTP_CARPETA || 'public_html/' }}
          # Archivos que no tienen por qué vivir en el servidor
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            data/productos/**
            data/categorias.json
            *.md
